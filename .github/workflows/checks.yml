# The quality gate, defined once and called by both build.yml (pushes and
# pull requests) and release.yml (tags). Keeping it in one place is the
# point: a release must clear exactly the same bar as a pull request, and
# two copies of these steps would eventually disagree.
#
# Three jobs, the same three in all three EVPanda SDKs:
#   lint     — once, since it does not vary by toolchain version
#   test     — across every supported toolchain
#   package  — prove what ships actually works, from outside this repo
name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The go.mod floor, read from the file so there is no second copy of
      # the number to drift — and deliberately not `stable`. golangci-lint
      # embeds the go/types from the Go release it was built with and
      # panics outright on source newer than that, so a floating toolchain
      # breaks this job the day Go ships a new version, with a type-checker
      # stack trace rather than a useful message.
      #
      # The floor is also the safest choice: the linter's type-checker only
      # ever has to be new enough, and it is the version consumers are
      # promised. Lint does not need a newer toolchain — the test matrix
      # below already covers those.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      # The version is pinned so a lint run is reproducible and a new
      # release cannot fail an unrelated pull request.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod floor is 1.24 (latest klauspost/compress requires it).
        # Test the floor and whatever Go currently ships.
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - run: go build ./...

      - run: go vet ./...

      # -race exercises the buffer mutex / worker goroutine under contention.
      - run: go test -race -count=1 ./...

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # A Go module has nothing to upload — a version exists the moment its
      # tag does. The equivalent of the other SDKs' "install the artifact
      # and import it" is compiling against the module from outside it,
      # which is what a consumer does and what catches an exported API that
      # does not build on its own.
      - name: Compile against the module as a consumer would
        run: |
          set -euo pipefail
          mkdir -p /tmp/consumer && cd /tmp/consumer
          cat > go.mod <<EOF
          module consumer

          go 1.24

          require github.com/evpanda-labs/evpanda-go v0.0.0

          replace github.com/evpanda-labs/evpanda-go => ${GITHUB_WORKSPACE}
          EOF
          cat > main.go <<'EOF'
          package main

          import (
          	evpanda "github.com/evpanda-labs/evpanda-go"
          	"github.com/evpanda-labs/evpanda-go/ocpi"
          )

          func main() {
          	panda, _ := evpanda.StartOCPI(evpanda.OCPIConfig{})
          	_ = panda.Stats()
          	_ = ocpi.Middleware(panda)
          	_ = ocpi.RoundTripper(panda, nil)
          	csms, _ := evpanda.StartOCPP(evpanda.OCPPConfig{})
          	_ = csms.Connection(evpanda.Charger{ID: "CP-001"})
          }
          EOF
          go mod tidy
          go build ./...
          echo "the module compiles for a consumer"
