name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod floor is 1.24 (latest klauspost/compress requires it).
        # Test the floor and whatever Go currently ships.
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - run: go build ./...

      - run: go vet ./...

      # -race exercises the buffer mutex / worker goroutine under contention.
      - run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned, and deliberately not `stable`. golangci-lint embeds the
      # go/types from the Go release it was built with, and panics outright
      # on source newer than that — so pairing a pinned linter with a
      # floating toolchain breaks this job the day Go ships a new version,
      # with a type-checker stack trace rather than a useful message.
      #
      # Lint does not need the newest toolchain; the build matrix above
      # already covers it. Bump this together with the linter version below.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      # action @v9 ships golangci-lint v2; the version is pinned so a lint
      # run is reproducible and a new release cannot fail an unrelated PR.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
