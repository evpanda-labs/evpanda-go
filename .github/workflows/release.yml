# Cuts a release when a semver tag is pushed.
#
# To release:
#   1. merge whatever the release contains to master
#   2. git tag v0.4.0 && git push origin v0.4.0
#
# Go modules have no registry and nothing to upload: a version exists the
# moment a semver tag is pushed, and proxy.golang.org fetches it straight
# from this repo. So `publish` is not an upload step — it is the nudge that
# makes the proxy fetch, so pkg.go.dev indexes the version in minutes
# rather than whenever a stranger first fetches it.
#
# What this workflow is really for is the gate: tags are immutable on the
# proxy once fetched, so a broken commit must not become a permanent
# version.
#
# The four jobs are the same four in all three EVPanda SDKs:
#   validate-tag → checks → publish → github-release
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is a valid version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Go requires the leading v and strict semver; anything else is
          # not a module version and the proxy will ignore it.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$TAG' is not a Go module version (want vX.Y.Z or vX.Y.Z-pre)"
            exit 1
          fi
          echo "$TAG is a valid module version"

      - name: Check the tag matches the version in the tree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Go has no version file — the tag is the version. What can
          # disagree is the module path: major 2 and above must live at a
          # /vN path, or consumers silently keep resolving the v1 line.
          # This is the single easiest Go release mistake to make, so fail
          # loudly rather than ship it.
          major="$(printf '%s' "$TAG" | sed -E 's|^v([0-9]+)\..*|\1|')"
          if [ "$major" -ge 2 ]; then
            if ! grep -Eq "^module .+/v${major}\$" go.mod; then
              echo "::error::$TAG needs the module path to end in /v${major}; go.mod says:"
              grep '^module ' go.mod
              exit 1
            fi
          fi
          echo "the module path matches $TAG"

      - name: Check the tag is on master
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$TAG" origin/master; then
            echo "::error::$TAG is not an ancestor of master — release from master only"
            exit 1
          fi
          echo "$TAG is on master"

  # The same gate a pull request clears, re-run against the tagged commit.
  checks:
    needs: validate-tag
    uses: ./.github/workflows/checks.yml

  publish:
    name: Publish to the Go module proxy
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mod="github.com/evpanda-labs/evpanda-go"

          # Asking the proxy for a version it has not seen is what makes it
          # fetch and cache from this repo; pkg.go.dev indexes from the
          # proxy shortly after. Without this the module stays invisible
          # until somebody happens to `go get` it.
          #
          # (Module paths with uppercase letters need !-escaping in proxy
          # URLs. This one is all lowercase, so the path is used as-is.)
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "https://proxy.golang.org/${mod}/@v/${TAG}.info"; then
              echo
              echo "::notice::${mod}@${TAG} is live on proxy.golang.org"
              echo "Docs: https://pkg.go.dev/${mod}@${TAG}"
              exit 0
            fi
            echo "proxy has not picked up ${TAG} yet (attempt ${attempt}/6), waiting..."
            sleep 20
          done

          # Not fatal: the version is already published by virtue of the tag
          # existing. It will be indexed on the first real fetch.
          echo "::warning::proxy did not serve ${TAG} within ~2 minutes; it will index on first fetch"

  github-release:
    name: Create the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes are generated from history

      - name: Create it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Pre-1.0 and pre-release tags are marked as such so consumers are
          # not told an unstable version is the latest stable one.
          flags=(--generate-notes --title "$TAG")
          case "$TAG" in
            v0.*|*-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" "${flags[@]}"
